{{- $hasAzure := ne .Values.assets.azure.sasToken "" }}
{{- $hasS3 := or (ne .Values.assets.s3.accessKeyId "") (or (ne .Values.assets.s3.secretAccessKey "") (ne .Values.assets.s3.sessionToken "")) }}
{{- if or $hasAzure $hasS3 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fsvoice.assetsSecretName" . }}
  labels:
    {{- include "fsvoice.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $hasAzure }}
  FSVOICE_AZURE_SAS_TOKEN: {{ .Values.assets.azure.sasToken | quote }}
  {{- end }}
  {{- if ne .Values.assets.s3.accessKeyId "" }}
  AWS_ACCESS_KEY_ID: {{ .Values.assets.s3.accessKeyId | quote }}
  {{- end }}
  {{- if ne .Values.assets.s3.secretAccessKey "" }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.assets.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if ne .Values.assets.s3.sessionToken "" }}
  AWS_SESSION_TOKEN: {{ .Values.assets.s3.sessionToken | quote }}
  {{- end }}
{{- end }}
