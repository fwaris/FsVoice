services:
  fsvoice:
    image: ${FSVOICE_IMAGE:-fsvoice-open-source:cuda13}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/open-source/Dockerfile
      args:
        LLAMA_CPP_VERSION: ${LLAMA_CPP_VERSION:-b9987}
        LLAMA_CUDA_ARCHITECTURES: ${LLAMA_CUDA_ARCHITECTURES:-80-real;80-virtual}
    gpus: all
    restart: unless-stopped
    stop_grace_period: 2m
    shm_size: 2gb
    ports:
      - "${FSVOICE_HTTP_PORT:-5067}:5067"
      - "50670-50679:50670-50679/udp"
    volumes:
      - type: bind
        source: ${FSVOICE_MODELS_DIR}
        target: /data/models
        read_only: true
      - type: bind
        source: ${FSVOICE_VOICES_DIR}
        target: /data/voices
        read_only: true
      - type: bind
        source: ${FSVOICE_INDEX_DIR}
        target: /data/indexes
        read_only: true
      - type: bind
        source: ${FSVOICE_WORK_DIR}
        target: /data/work
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5067
      LLAMA_CPP_MODEL: /data/models/${FSVOICE_GEMMA_MODEL_FILE:-gemma-4-E2B_q4_0-it.gguf}
      LLAMA_CPP_CONTEXT_SIZE: ${LLAMA_CPP_CONTEXT_SIZE:-16384}
      LLAMA_CPP_GPU_LAYERS: ${LLAMA_CPP_GPU_LAYERS:-999}
      LLAMA_CPP_PARALLEL: ${LLAMA_CPP_PARALLEL:-1}
      LLAMA_CPP_THREADS: ${LLAMA_CPP_THREADS:-}
      LLAMA_CPP_EXTRA_ARGS: ${LLAMA_CPP_EXTRA_ARGS:-}
      LLAMA_CPP_STARTUP_TIMEOUT_SECONDS: ${LLAMA_CPP_STARTUP_TIMEOUT_SECONDS:-900}
      OpenSourceVoice__WorkDir: /data/work
      OpenSourceVoice__MaxHistoryTurns: ${FSVOICE_MAX_HISTORY_TURNS:-10}
      OpenSourceVoice__Gemma__LlamaCppEndpoint: http://127.0.0.1:8081
      OpenSourceVoice__Gemma__LlamaCppModel: ${FSVOICE_GEMMA_MODEL_FILE:-gemma-4-E2B_q4_0-it.gguf}
      OpenSourceVoice__Stt__Runtime: parakeet-tdt-onnx
      OpenSourceVoice__Stt__ModelDir: /data/models/parakeet-tdt-0.6b-v3-onnx
      OpenSourceVoice__Stt__ExecutionProvider: cuda
      OpenSourceVoice__Stt__Precision: ${FSVOICE_PARAKEET_PRECISION:-fp32}
      OpenSourceVoice__Vad__ModelPath: /data/models/silero-vad-onnx/silero_vad.onnx
      OpenSourceVoice__Vad__AllowBargeIn: ${FSVOICE_ALLOW_BARGE_IN:-true}
      OpenSourceVoice__Tts__ModelDir: /data/models/pocket-tts-onnx-english-2026-04
      OpenSourceVoice__Tts__ExecutionProvider: cpu
      OpenSourceVoice__Tts__Precision: ${FSVOICE_POCKET_TTS_PRECISION:-int8}
      OpenSourceVoice__Tts__VoiceSamplePath: /data/voices/${FSVOICE_VOICE_FILE:-default_voice.wav}
      OpenSourceVoice__Index__BundleDirectory: /data/indexes
      OpenSourceVoice__WebRtc__BindAddress: 0.0.0.0
      OpenSourceVoice__WebRtc__IcePortStart: 50670
      OpenSourceVoice__WebRtc__IcePortEnd: 50679
      OpenSourceVoice__WebRtc__IncludeAllInterfaceAddresses: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:5067/healthz/ready"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3
